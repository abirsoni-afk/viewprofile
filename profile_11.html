<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IndiaMART - Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    background: #fff;
    max-width: 480px;
    margin: 0 auto;
    color: hsl(220,8%,35%); /* neutral-700 */
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  /* Top bar */
  .topbar {
    background: #1d8480; /* primary */
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    flex-shrink: 0;
  }
  .hamburger { display: flex; flex-direction: column; gap: 5px; width: 22px; }
  .hamburger span { display: block; height: 2px; background: #fff; }
  .logo { display: flex; align-items: center; gap: 6px; }
  .logo img { height: 26px; }
  .logo-text { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .chat-icon { position: relative; width: 26px; }
  .chat-badge {
    position: absolute; top: -8px; right: -8px;
    background: #dc3545; color: #fff; font-size: 11px;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }

  /* Profile header */
  .profile-header {
    background: #fff;
    display: flex;
    align-items: center;
    padding: 12px 16px 4px;
    flex-shrink: 0;
  }
  .profile-info { flex: 1; }
  .name-row { display: flex; align-items: center; gap: 8px; }
  .profile-info .name { font-size: 18px; font-weight: 700; color: hsl(220,14%,10%); } /* neutral-900 */
  .verify-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #fff;
    border: 1px solid hsl(220,10%,84%); /* border */
    color: hsl(220,14%,10%);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px 5px 7px;
    border-radius: 20px;
    white-space: nowrap;
    animation: pillGlow 1.8s ease-out 0.3s 1;
  }
  @keyframes pillGlow {
    0% {
      box-shadow: 0 0 0 0 rgba(29,132,128,0.5);
      border-color: hsl(220,10%,84%);
    }
    30% {
      box-shadow: 0 0 0 5px rgba(29,132,128,0.18);
      border-color: #1d8480;
    }
    100% {
      box-shadow: 0 0 0 0 rgba(29,132,128,0);
      border-color: hsl(220,10%,84%);
    }
  }

  /* Grid buttons */
  .menu-grid {
    background: #fff;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 6px 16px 16px;
    border-bottom: 1px solid hsl(220,10%,84%);
    flex-shrink: 0;
  }
  .menu-item {
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    color: hsl(220,14%,10%);
    cursor: pointer;
  }
  .menu-item svg { flex-shrink: 0; color: #1d8480; width: 20px; height: 20px; }

  /* Email verify row */
  .email-row {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px;
    border-bottom: 1px solid hsl(220,10%,84%);
    flex-shrink: 0;
  }
  .email-row-left { display: flex; align-items: center; gap: 12px; }
  .email-icon { flex-shrink: 0; }
  .email-title { font-size: 14px; font-weight: 700; color: hsl(220,14%,10%); display: flex; align-items: center; gap: 6px; }
  .update-btn {
    background: #1d8480; /* primary */
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* List section */
  .list-section {
    background: #fff;
    border-bottom: 1px solid hsl(220,10%,84%);
    flex-shrink: 0;
  }
  .list-heading {
    font-size: 12px;
    font-weight: 700;
    color: hsl(220,6%,46%); /* neutral-600 */
    text-transform: uppercase;
    letter-spacing: 0.4px;
    padding: 16px 16px 8px;
  }
  .list-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    border-bottom: 1px solid hsl(220,14%,92%); /* neutral-200 */
    cursor: pointer;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item-left { display: flex; align-items: center; gap: 14px; font-size: 14px; color: hsl(220,14%,10%); }
  .list-item-left svg { flex-shrink: 0; color: #1d8480; }
  .list-item .chevron { color: hsl(220,8%,72%); flex-shrink: 0; } /* neutral-400 */

  /* Suggest row */
  .row {
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid hsl(220,10%,84%);
    font-size: 14px;
    flex-shrink: 0;
  }
  .row-left { display: flex; align-items: center; gap: 12px; color: hsl(220,14%,10%); }
  .row-left svg { color: #1d8480; }
  .suggest-link { color: #1d8480; font-weight: 600; cursor: pointer; }

  /* Sign out */
  .signout {
    background: #fff;
    text-align: left;
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 500;
    color: #dc3545; /* destructive */
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 14px;
    cursor: pointer;
    border-bottom: 1px solid hsl(220,10%,84%);
    flex-shrink: 0;
  }
  .signout svg { stroke: #dc3545; }

  .footer {
    display: none;
  }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-top: 1px solid hsl(220,10%,84%);
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 8px 0 10px;
    box-shadow: 0 -1px 3px 0 rgba(30,42,58,0.06);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: hsl(220,6%,46%);
    font-size: 11px;
    cursor: pointer;
    flex: 1;
  }
  .nav-item.active { color: #1d8480; }
  .nav-item svg { flex-shrink: 0; }
  .nav-fill { height: 62px; flex-shrink: 0; }
</style>
</head>
<body>

  <div class="topbar">
